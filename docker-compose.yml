services:
  db:
    image: postgres:15-alpine
    container_name: saas_banco_horas_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: saas_banco_horas_api
    restart: always
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      DOMAIN_URL: ${DOMAIN_URL}
      BACK_URL: ${DOMAIN_URL}
      FRONTEND_URL: ${DOMAIN_URL}
    depends_on:
      - db

  backup:
    build: ./backup
    container_name: saas_banco_horas_backup
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backups:/backups
    depends_on:
      - db

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: saas_banco_horas_cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  pg_data:
